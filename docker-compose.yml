services:
  tika:
    image: apache/tika:latest
    container_name: ramonda-tika
    ports:
      - "9998:9998"
    restart: unless-stopped
  opensearch:
    # shortcut: the security plugin is off for local use; a deployment turns TLS and auth on.
    image: opensearchproject/opensearch:2.19.0
    container_name: ramonda-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ramonda-postgres
    env_file:
      - ./ramonda/retrieval/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ramonda/retrieval/initdb.sh:/docker-entrypoint-initdb.d/01-retrieval.sh:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
  ingest:
    profiles: ["ingest"]
    build: .
    depends_on:
      - tika
      - postgres
      - opensearch
    environment:
      TIKA_URL: http://tika:9998
      POSTGRES_HOST: postgres
      OPENSEARCH_URL: http://opensearch:9200
    env_file:
      - .env
      - ./ramonda/retrieval/.env
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
      - ./out:/app/out
      - cache:/root/.cache
volumes:
  cache:
  postgres_data:
  opensearch_data:
