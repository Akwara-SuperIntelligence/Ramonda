services:
  tika:
    image: apache/tika:latest
    container_name: ramonda-tika
    ports:
      - "9998:9998"
    restart: unless-stopped
  ingest:
    profiles: ["ingest"]
    build: .
    depends_on:
      - tika
    environment:
      TIKA_URL: http://tika:9998
    env_file:
      - .env
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
      - ./out:/app/out
      - cache:/root/.cache
volumes:
  cache:
