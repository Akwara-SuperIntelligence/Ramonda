name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - name: rustfmt
        working-directory: core
        run: cargo fmt --check
      - name: clippy
        working-directory: core
        run: cargo clippy --locked --all-targets --all-features -- -D warnings -D clippy::pedantic
      - name: crate-graph
        working-directory: core
        run: ./check-crate-graph.sh

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false
      - name: sync
        working-directory: connectors
        run: uv sync --frozen
      - name: ruff
        working-directory: connectors
        run: uv run --frozen ruff check
      - name: pyright
        working-directory: connectors
        run: uv run --frozen pyright
      - name: pytest
        working-directory: connectors
        run: uv run --frozen pytest -W error
      - name: import-linter
        working-directory: connectors
        run: ./check_imports

  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: core/console/package.json
          no-cache: true
      - name: install
        working-directory: core/console
        run: bun install --frozen-lockfile
      - name: tsc
        working-directory: core/console
        run: bun run typecheck
      - name: biome
        working-directory: core/console
        run: bun run lint -- --error-on-warnings
      - name: dependency-cruiser
        working-directory: core/console
        run: bun run depcruise

  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: path homes
        run: .github/check-layout.sh homes
      - name: packs and clients
        run: .github/check-layout.sh config
