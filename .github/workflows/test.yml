name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ramonda
          POSTGRES_PASSWORD: ramonda
          POSTGRES_DB: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ramonda -d agent"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ramonda:ramonda@127.0.0.1:5432/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/agent/pyproject.toml
      - name: Links
        run: python scripts/check_links.py
      - run: pip install -e "./services/agent[dev]"
      - name: Migrate
        run: |
          python - <<'EOF'
          import glob, os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True) as conn:
              for path in sorted(glob.glob("services/agent/migrations/*.sql")):
                  conn.execute(open(path).read())
          EOF
      - name: Test
        working-directory: services/agent
        run: python -m pytest -q
