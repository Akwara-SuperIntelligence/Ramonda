x-rakazo-environment: &rakazo-environment
  NODE_ENV: production
  DATABASE_URL: postgres://rakazo_app:rakazo-app@rakazo-db:5432/rakazo
  DATA_DIR: /data
  ENCRYPTION_KEY: ramonda-dev-rakazo-encryption-key-32b
  CONTENT_ENCRYPTION: "off"
  SANDBOX_PROVIDER: none
  AGENT_RUNTIME: pi
  API_URL: http://127.0.0.1:5173
  MCP_ALLOW_PRIVATE_ENDPOINT: "true"
  NODE_EXTRA_CA_CERTS: /certs/ca.crt
  PI_DEFAULT_PROVIDER: ${PI_DEFAULT_PROVIDER:-deepseek}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: ramonda
      POSTGRES_PASSWORD: ramonda
      POSTGRES_DB: ramonda
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres/001_audit_log.sql:/docker-entrypoint-initdb.d/001_audit_log.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ramonda -d ramonda"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    # Import skips an existing realm. No data volume, so recreate the container to apply realm changes.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "false"
      # The healthcheck speaks plain HTTP to port 9000. Only 8443 is published.
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_HTTPS_CERTIFICATE_FILE: /certs/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/tls.key
      # A browser needs `127.0.0.1 keycloak` in the host hosts file and trust of deploy/keycloak/dev-only-ca.crt. The issuer host stays keycloak so tokens match KEYCLOAK_ISSUER.
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_PORT: "8443"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./keycloak/akwara-cafe-realm.json:/opt/keycloak/data/import/akwara-cafe-realm.json:ro
      - ./keycloak/dev-only-tls.crt:/certs/tls.crt:ro
      - ./keycloak/dev-only-tls.key:/certs/tls.key:ro
    ports:
      - "127.0.0.1:8443:8443"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 40s

  openbao:
    image: openbao/openbao:2.7.2
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ramonda-dev
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo-db:
    image: postgres:18.7
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:20.0-20261112
    entrypoint: ["bash", "/odoo-init.sh"]
    environment:
      HOST: odoo-db
      PORT: "5432"
      USER: odoo
      PASSWORD: odoo
      PGPASSWORD: odoo
      ODOO_DATABASE: akwara
    volumes:
      - ./odoo/init.sh:/odoo-init.sh:ro
      - ./odoo/logins.json:/etc/odoo/logins.json:ro
    ports:
      - "127.0.0.1:8069:8069"
    depends_on:
      odoo-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8069/web/health >/dev/null && psql -h "$$HOST" -U "$$USER" -d "$$ODOO_DATABASE" -tAc "SELECT count(*) FROM ir_module_module WHERE name IN ('point_of_sale','stock') AND state = 'installed'" | grep -qx 2
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 300s

  gateway:
    build:
      context: ..
      dockerfile: core/gateway/Dockerfile
    image: ramonda-gateway:dev
    profiles: ["gateway"]
    environment:
      KEYCLOAK_ISSUER: https://keycloak:8443/realms/akwara-cafe
      GATEWAY_AUDIENCE: gateway
      GATEWAY_PUBLIC_URL: http://gateway:8080
      GATEWAY_TLS_CA: /certs/ca.crt
      DATABASE_URL: postgres://ramonda_app:ramonda_app@postgres:5432/ramonda
    volumes:
      - ./keycloak/dev-only-ca.crt:/certs/ca.crt:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "{ printf 'GET /.well-known/oauth-protected-resource/mcp HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/8080",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy

  rakazo-db:
    image: postgres:18.7
    environment:
      POSTGRES_USER: rakazo
      POSTGRES_PASSWORD: rakazo
      POSTGRES_DB: rakazo
    volumes:
      - rakazo-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rakazo -d rakazo"]
      interval: 5s
      timeout: 5s
      retries: 10

  rakazo-data:
    image: busybox:1
    command: ["chown", "-R", "1000:1000", "/data"]
    volumes:
      - rakazo-data:/data
    restart: "no"

  rakazo-migrate:
    image: ghcr.io/elie222/rakazo/app:v0.9.0
    working_dir: /app/apps/api
    command: ["pnpm", "db:deploy"]
    environment:
      DATABASE_URL: postgres://rakazo_app:rakazo-app@rakazo-db:5432/rakazo
      DATABASE_MIGRATION_URL: postgres://rakazo:rakazo@rakazo-db:5432/rakazo
    restart: "no"
    depends_on:
      rakazo-db:
        condition: service_healthy

  rakazo-api:
    image: ghcr.io/elie222/rakazo/app:v0.9.0
    working_dir: /app/apps/api
    command: ["node", "--enable-source-maps", "dist/index.js"]
    environment:
      <<: *rakazo-environment
      API_HOST: 0.0.0.0
      BETTER_AUTH_SECRET: ramonda-dev-rakazo-auth-secret-32bx
      BETTER_AUTH_URL: http://127.0.0.1:5173
      WEB_ORIGIN: http://127.0.0.1:5173
      AUTH_PASSWORD_ENABLED: "false"
      OIDC_ISSUER: https://keycloak:8443/realms/akwara-cafe
      OIDC_CLIENT_ID: rakazo
      OIDC_CLIENT_SECRET: rakazo
      OIDC_NAME: Keycloak
      OIDC_SCOPES: openid email profile
      OIDC_ALLOW_SIGNUP_BYPASS: "true"
      SIGNUPS_ENABLED: "true"
      SCREEN_PROXY_SECRET: ramonda-dev-rakazo-screen-proxy-32b
    volumes:
      - rakazo-data:/data
      - ./keycloak/dev-only-ca.crt:/certs/ca.crt:ro
    depends_on:
      rakazo-db:
        condition: service_healthy
      rakazo-data:
        condition: service_completed_successfully
      rakazo-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  rakazo-worker:
    image: ghcr.io/elie222/rakazo/app:v0.9.0
    working_dir: /app/apps/worker
    command: ["node", "--enable-source-maps", "dist/index.js"]
    environment:
      <<: *rakazo-environment
    volumes:
      - rakazo-data:/data
      - ./keycloak/dev-only-ca.crt:/certs/ca.crt:ro
    depends_on:
      rakazo-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "dist/health-check.js"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rakazo-web:
    image: ghcr.io/elie222/rakazo/app:v0.9.0
    working_dir: /app/apps/web
    command: ["node_modules/.bin/vite", "preview", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      NODE_ENV: production
      RAYON_NUM_THREADS: "4"
      API_PROXY_TARGET: http://rakazo-api:3100
      RAKAZO_HOST: 127.0.0.1
      SCREEN_PROXY_SECRET: ramonda-dev-rakazo-screen-proxy-32b
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      rakazo-api:
        condition: service_healthy

volumes:
  rakazo-db:
  rakazo-data:
