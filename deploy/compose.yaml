services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: ramonda
      POSTGRES_PASSWORD: ramonda
      POSTGRES_DB: ramonda
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres/001_audit_log.sql:/docker-entrypoint-initdb.d/001_audit_log.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ramonda -d ramonda"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "false"
      # The healthcheck speaks plain HTTP to port 9000. Only 8443 is published.
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_HTTPS_CERTIFICATE_FILE: /certs/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/tls.key
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_PORT: "8443"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./keycloak/akwara-cafe-realm.json:/opt/keycloak/data/import/akwara-cafe-realm.json:ro
      - ./keycloak/dev-only-tls.crt:/certs/tls.crt:ro
      - ./keycloak/dev-only-tls.key:/certs/tls.key:ro
    ports:
      - "127.0.0.1:8443:8443"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 40s

  openbao:
    image: openbao/openbao:2.7.2
    environment:
      # dev-only: local root token for this stamp. Not a production secret.
      BAO_DEV_ROOT_TOKEN_ID: ramonda-dev
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 10

  # dev-only: writes deploy/odoo/logins.json into OpenBao. Not production secrets.
  openbao-seed:
    image: openbao/openbao:2.7.2
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      BAO_ADDR: http://openbao:8200
      # dev-only: same local root token as the openbao service. Not a production secret.
      BAO_TOKEN: ramonda-dev
    entrypoint: ["/bin/sh", "/seed.sh"]
    volumes:
      - ./openbao/seed.sh:/seed.sh:ro
      - ./odoo/logins.json:/logins.json:ro
    # Dev mode drops these secrets on restart. Recreate this service to write them again.
    restart: "no"

  odoo-db:
    image: postgres:18.7
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:20.0-20261112
    entrypoint: ["bash", "/odoo-init.sh"]
    environment:
      HOST: odoo-db
      PORT: "5432"
      USER: odoo
      PASSWORD: odoo
      PGPASSWORD: odoo
      ODOO_DATABASE: akwara
    volumes:
      - ./odoo/init.sh:/odoo-init.sh:ro
      - ./odoo/logins.json:/etc/odoo/logins.json:ro
    ports:
      - "127.0.0.1:8069:8069"
    depends_on:
      odoo-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8069/web/health >/dev/null && psql -h "$$HOST" -U "$$USER" -d "$$ODOO_DATABASE" -tAc "SELECT count(*) FROM ir_module_module WHERE name IN ('point_of_sale','stock') AND state = 'installed'" | grep -qx 2
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 300s

  gateway:
    build:
      context: ..
      dockerfile: core/gateway/Dockerfile
    image: ramonda-gateway:dev
    profiles: ["gateway"]
    environment:
      KEYCLOAK_ISSUER: https://keycloak:8443/realms/akwara-cafe
      GATEWAY_AUDIENCE: gateway
      GATEWAY_PUBLIC_URL: http://gateway:8080
      GATEWAY_TLS_CA: /certs/ca.crt
      DATABASE_URL: postgres://ramonda_app:ramonda_app@postgres:5432/ramonda
    volumes:
      - ./keycloak/dev-only-ca.crt:/certs/ca.crt:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "{ printf 'GET /.well-known/oauth-protected-resource/mcp HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/8080",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
