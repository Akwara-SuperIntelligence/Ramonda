services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: ramonda
      POSTGRES_PASSWORD: ramonda
      POSTGRES_DB: ramonda
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ramonda -d ramonda"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/akwara-cafe-realm.json:/opt/keycloak/data/import/akwara-cafe-realm.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 40s

  openbao:
    image: openbao/openbao:2.7.2
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ramonda-dev
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo-db:
    image: postgres:18.7
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:20.0-20261112
    entrypoint: ["bash", "/odoo-init.sh"]
    environment:
      HOST: odoo-db
      PORT: "5432"
      USER: odoo
      PASSWORD: odoo
      PGPASSWORD: odoo
      ODOO_DATABASE: akwara
    volumes:
      - ./odoo/init.sh:/odoo-init.sh:ro
      - ./odoo/logins.json:/etc/odoo/logins.json:ro
    ports:
      - "127.0.0.1:8069:8069"
    depends_on:
      odoo-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8069/web/health >/dev/null && psql -h "$$HOST" -U "$$USER" -d "$$ODOO_DATABASE" -tAc "SELECT count(*) FROM ir_module_module WHERE name IN ('point_of_sale','stock') AND state = 'installed'" | grep -qx 2
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 300s
