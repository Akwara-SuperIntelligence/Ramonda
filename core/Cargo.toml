[workspace]
resolver = "3"
members = ["gateway", "relay", "outbox"]
exclude = ["console"]

[workspace.package]
edition = "2024"
publish = false
version = "0.1.0"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = "deny"
disallowed_methods = { level = "allow", priority = 1 }
disallowed_macros = { level = "allow", priority = 1 }
disallowed_types = { level = "allow", priority = 1 }
