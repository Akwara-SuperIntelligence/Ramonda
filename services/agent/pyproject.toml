[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-service"
version = "0.0.0"
description = "The always-on agent service"
requires-python = ">=3.12"
dependencies = ["temporalio>=1.9", "psycopg[binary]>=3.2", "aiokafka>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
