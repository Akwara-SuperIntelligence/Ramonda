name: ramonda

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ramonda
      POSTGRES_PASSWORD: ramonda
      POSTGRES_DB: ramonda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ramonda -d ramonda"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
